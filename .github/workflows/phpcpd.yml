name: PHPCPD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpcpd:
    name: PHPCPD
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none

      - name: Install project dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install PHPCPD
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer-phpcpd
        run: |
          composer global require --no-interaction --no-progress sebastian/phpcpd:6.0.3
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: Run PHPCPD
        run: composer deduplicate:check
